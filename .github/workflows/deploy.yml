name: Test and deploy to Apps Script

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check secrets
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::warning::CLASPRC_JSON or SCRIPT_ID secret missing - skipping deploy. See README."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Install clasp
        if: env.SKIP != '1'
        run: npm install -g @google/clasp@2.4.2
      - name: Write clasp credentials
        if: env.SKIP != '1'
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"src"}' "$SCRIPT_ID" > .clasp.json
      - name: Push code
        if: env.SKIP != '1'
        run: clasp push -f
      - name: Update web app deployment
        if: env.SKIP != '1' && env.DEPLOYMENT_ID != ''
        run: clasp deploy -i "$DEPLOYMENT_ID" -d "CI ${GITHUB_SHA::7}"

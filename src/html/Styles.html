<style>
  :root { --bg:#0f1220; --card:#171b2e; --line:#2a3050; --text:#eef0f8; --muted:#9aa3c0; --accent:#ffb020; --ok:#3ecf8e; --bad:#ff5d5d; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  a { color: var(--accent); }
  h1,h2,h3 { line-height:1.2; margin:0 0 .5em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  .narrow { max-width:480px; margin:10vh auto; text-align:center; }
  .btn { display:inline-block; background:var(--accent); color:#1a1300; border:0; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; text-decoration:none; font-size:15px; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .btn.small { padding:4px 10px; font-size:13px; }
  .btn.big { width:100%; padding:14px; font-size:18px; }
  .btn:disabled { opacity:.6; cursor:wait; }
  input, select, textarea { width:100%; padding:10px 12px; margin:6px 0; border-radius:10px; border:1px solid var(--line); background:#0c0f1b; color:var(--text); font:inherit; }
  textarea { min-height:90px; }
  label { display:block; font-size:13px; color:var(--muted); margin-top:8px; }
  .hidden, .hp { display:none !important; }
  .fine { font-size:12px; color:var(--muted); }
  .msg { min-height:1.5em; }

  /* Bridge page */
  body.public { padding:16px; }
  .bridge { max-width:640px; margin:24px auto; }
  .bridge .brand { color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:12px; }
  .bridge h1 { font-size:clamp(26px,5vw,38px); }
  .subhead { color:var(--muted); font-size:18px; }
  .video { position:relative; padding-top:56.25%; margin:16px 0; border-radius:12px; overflow:hidden; }
  .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .bullets { padding-left:1.2em; }
  .bullets li { margin:6px 0; }
  .bullets li::marker { content:"\2714  "; color:var(--ok); }

  /* Admin */
  .app { max-width:1100px; margin:0 auto; padding:16px; }
  header.top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  nav.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  nav.tabs button { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer; font:inherit; }
  nav.tabs button.on { background:var(--accent); color:#1a1300; border-color:var(--accent); font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .stat .n { font-size:30px; font-weight:800; }
  .stat .l { color:var(--muted); font-size:13px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:700px){ .row2 { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .scroll { overflow-x:auto; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .pill.Posted, .pill.active { color:var(--ok); border-color:var(--ok); }
  .pill.Filmed { color:var(--accent); border-color:var(--accent); }
  .pill.unsubscribed { color:var(--bad); border-color:var(--bad); }
  code.link { display:block; word-break:break-all; font-size:12px; color:var(--muted); }
  pre.script { white-space:pre-wrap; margin:0; font:13px/1.4 inherit; color:var(--muted); }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); padding:10px 16px; border-radius:10px; }
  .playbook h2 { margin-top:1.2em; color:var(--accent); }
  .playbook li { margin:4px 0; }
  section.panel > .card + .card { margin-top:12px; }
</style>
